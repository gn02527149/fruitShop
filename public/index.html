<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>鮮果市集 — 產地直送好水果</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header>
    <a class="logo" href="/">🍉 鮮果市集</a>
    <nav>
      <a href="/">商品</a>
      <a href="/cart.html">🛒 購物車 <span class="cart-badge" id="cartCount">0</span></a>
    </nav>
  </header>

  <main>
    <h1 class="page-title">今日鮮果</h1>
    <div class="category-bar" id="categoryBar"></div>
    <div class="product-grid" id="productGrid"></div>
  </main>

  <div class="toast" id="toast"></div>

  <script src="/cart.js"></script>
  <script>
    let shop = { categories: [], products: [], settings: {} };
    let currentCategory = 0; // 0 = 全部

    async function load() {
      const res = await fetch('/api/shop');
      shop = await res.json();
      renderCategories();
      renderProducts();
    }

    function renderCategories() {
      const bar = document.getElementById('categoryBar');
      const cats = [{ id: 0, name: '全部' }, ...shop.categories];
      bar.innerHTML = cats.map((c) =>
        `<button class="${c.id === currentCategory ? 'active' : ''}" onclick="pickCategory(${c.id})">${c.name}</button>`
      ).join('');
    }

    function pickCategory(id) {
      currentCategory = id;
      renderCategories();
      renderProducts();
    }

    function productState(p) {
      const totalStock = p.variants.reduce((s, v) => s + v.stock, 0);
      if (totalStock > 0) return 'normal';
      return p.allowPreorder ? 'preorder' : 'soldout';
    }

    function renderProducts() {
      const grid = document.getElementById('productGrid');
      const list = shop.products.filter(
        (p) => currentCategory === 0 || p.categoryIds.includes(currentCategory)
      );
      if (list.length === 0) {
        grid.innerHTML = '<div class="empty">這個分類目前沒有商品</div>';
        return;
      }

      grid.innerHTML = list.map((p) => {
        const state = productState(p);
        const badges = [];
        if (state === 'soldout') badges.push('<span class="badge badge-soldout">已售完</span>');
        if (state === 'preorder') badges.push('<span class="badge badge-preorder">開放預購</span>');
        if (p.excludeFreeShipping) badges.push('<span class="badge badge-nofree">不計免運</span>');

        return `
        <div class="card">
          <div class="badges">${badges.join('')}</div>
          <div class="thumb">${p.image ? `<img src="${p.image}" alt="${p.name}">` : p.emoji}</div>
          <div class="body">
            <div class="name">${p.name}</div>
            <div class="desc">${p.description}</div>
            <div class="price" id="price-${p.id}"></div>
            <div class="row">
              <select id="variant-${p.id}" onchange="updatePrice(${p.id})">
                ${p.variants.map((v, i) => `<option value="${i}">${v.unit}</option>`).join('')}
              </select>
              <input type="number" id="qty-${p.id}" value="1" min="1" />
            </div>
            <button id="add-${p.id}" onclick="addToCart(${p.id})"></button>
          </div>
        </div>`;
      }).join('');

      list.forEach((p) => updatePrice(p.id));
    }

    function updatePrice(productId) {
      const p = shop.products.find((x) => x.id === productId);
      const idx = Number(document.getElementById(`variant-${productId}`).value);
      const v = p.variants[idx];
      const priceEl = document.getElementById(`price-${productId}`);
      const btn = document.getElementById(`add-${productId}`);

      priceEl.innerHTML = `NT$ ${v.price} <small>/ ${v.unit}${v.stock > 0 ? `　庫存 ${v.stock}` : ''}</small>`;

      if (v.stock > 0) {
        btn.textContent = '加入購物車';
        btn.disabled = false;
        btn.classList.remove('btn-orange');
      } else if (p.allowPreorder) {
        btn.textContent = '預購';
        btn.disabled = false;
        btn.classList.add('btn-orange');
        priceEl.innerHTML = `NT$ ${v.price} <small>/ ${v.unit}　預計 ${p.preorderDate || '待定'} 到貨</small>`;
      } else {
        btn.textContent = '已售完';
        btn.disabled = true;
      }
    }

    function addToCart(productId) {
      const p = shop.products.find((x) => x.id === productId);
      const idx = Number(document.getElementById(`variant-${productId}`).value);
      const v = p.variants[idx];
      const qty = Math.max(1, Number(document.getElementById(`qty-${productId}`).value) || 1);

      Cart.add(productId, v.unit, qty);
      updateCartBadge();
      showToast(v.stock === 0
        ? `已將「${p.name}（${v.unit}）」加入預購`
        : `已將「${p.name}（${v.unit}）」×${qty} 加入購物車`);
    }

    let toastTimer;
    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 1800);
    }

    load();
    updateCartBadge();
  </script>
</body>
</html>
